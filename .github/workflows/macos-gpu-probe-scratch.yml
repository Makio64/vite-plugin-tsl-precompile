name: One-shot macOS WebGPU evidence probe

on:
  push:
    branches:
      - codex/macos-gpu-probe
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-gpu-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  campaign:
    if: github.ref == 'refs/heads/codex/macos-gpu-probe'
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Configure isolated campaign output
        shell: bash
        run: echo "TSLP_E2E_OUT=$RUNNER_TEMP/macos-evidence-campaign" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check out Three.js r185
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: mrdoob/three.js
          ref: 2431a09f46f34c560bc8e44b33be0e567723d5b9
          path: three.js
          fetch-depth: 1
          sparse-checkout: |
            build
            examples
            src
            package.json
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Build exact slim bundle
        run: TSLP_FAIL_ON_REWRITE_WARNING=1 pnpm --filter @tsl-precompile/runtime build:slim
      - name: Run exact 254-case campaign on native Metal WebGPU
        run: >-
          node packages/examples/batch/run-evidence-campaign.mjs
          --three-repo="$GITHUB_WORKSPACE/three.js"
          --output-root="$TSLP_E2E_OUT"
          --campaign-id="macos-probe-${GITHUB_SHA}"
      - name: Print aggregate verdict
        if: always()
        shell: bash
        run: |
          if test -f "$TSLP_E2E_OUT/coverage-summary.json"; then
            node -e "const j=require(process.argv[1]); console.log(JSON.stringify({campaignId:j.campaignId,totals:j.totals,rows:j.rows?.length},null,2))" "$TSLP_E2E_OUT/coverage-summary.json"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: macos-evidence-campaign-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/macos-evidence-campaign/coverage-summary.json
            ${{ runner.temp }}/macos-evidence-campaign/coverage-evidence-set.json
            ${{ runner.temp }}/macos-evidence-campaign/e2e-report.json
            ${{ runner.temp }}/macos-evidence-campaign/evidence-manifest.json
            ${{ runner.temp }}/macos-evidence-campaign/cohorts/**/*-e2e-report.json
            ${{ runner.temp }}/macos-evidence-campaign/cohorts/**/evidence-manifest.json
          if-no-files-found: warn
          retention-days: 7
