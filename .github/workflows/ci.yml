name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Complete suite
        run: pnpm test:full
      - name: Slim production budgets
        run: pnpm test:slim:budget

  verify:
    name: Staleness audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  tier1-visual:
    name: Tier-1 visual gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Build slim bundle with rewrite fallbacks fatal
        run: TSLP_FAIL_ON_REWRITE_WARNING=1 pnpm --filter @tsl-precompile/runtime build:slim
      - name: Run configured tier-1 visual subset
        run: xvfb-run -a pnpm test:e2e:tier1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tier1-visual-results
          path: |
            packages/examples/batch/results/tier1-report.json
            packages/examples/batch/results/coverage-summary.md
            packages/examples/batch/results/shots/*.png
          if-no-files-found: ignore

  preview-smoke-ocean:
    name: Preview smoke (ocean)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Run preview smoke for ocean
        run: xvfb-run -a pnpm --filter examples-preview-smoke test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-smoke-ocean-results
          path: packages/examples/preview-smoke/results/**
          if-no-files-found: ignore

  fresh-project-smoke:
    # End-to-end smoke that packs the three publishable packages, installs
    # them into a temp project with `npm` (NOT workspace), runs vite dev to
    # capture an artifact, then vite build + preview. Catches publish-time
    # breakage that workspace:* linking hides — see commit history for the
    # inspector-panel constant-folding regression this job exists to prevent.
    name: Fresh-project smoke (publish path)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Run fresh-project-smoke
        run: xvfb-run -a pnpm test:fresh-project
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fresh-project-smoke-results
          path: packages/examples/fresh-project-smoke/results/**
          if-no-files-found: ignore
