name: Batch harness (Phase 6)

# Runs the full WebGPU example harness against the exact shipping Three tag.
# Skipped on every push because it is expensive; runs nightly and on demand.

on:
  schedule:
    - cron: '17 5 * * *'   # 05:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  batch:
    name: Exact 254-case evidence campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Configure runner-temporary output paths
        run: |
          {
            echo "TSLP_E2E_OUT=$RUNNER_TEMP/nightly-e2e"
            echo "TSLP_STOCK_OUT=$RUNNER_TEMP/nightly-stock-preflight"
            echo "TSLP_STOCK_REPORT=$RUNNER_TEMP/nightly-stock-preflight/report.json"
            echo "TSLP_SITE_PUBLIC_OUT=$RUNNER_TEMP/nightly-site-public"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check out the matching three.js examples corpus
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: mrdoob/three.js
          ref: 2431a09f46f34c560bc8e44b33be0e567723d5b9 # official r185 commit
          path: three.js
          fetch-depth: 1
          sparse-checkout: |
            build
            examples
            src
            package.json
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Canonical 209-case stock-renderer sweep
        run: >-
          xvfb-run -a node packages/examples/batch/run.mjs
          --three-repo="$GITHUB_WORKSPACE/three.js"
          --output-root="$TSLP_STOCK_OUT"
          --canonical-evidence
      - name: Build slim bundle with rewrite fallbacks fatal
        run: TSLP_FAIL_ON_REWRITE_WARNING=1 pnpm --filter @tsl-precompile/runtime build:slim
      - name: Run exact upstream and six-local-cohort capture/replay campaign
        run: xvfb-run -a pnpm test:e2e:campaign -- --three-repo="$GITHUB_WORKSPACE/three.js"
      - name: Generate site data from the same immutable evidence
        run: pnpm --filter @tsl-precompile/site data
      - name: Build and audit the production site
        run: pnpm build:site
      - name: Exercise the built compiler-free live examples
        run: xvfb-run -a pnpm --filter @tsl-precompile/site test:live
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: nightly-full-e2e-results
          path: |
            ${{ runner.temp }}/nightly-e2e/e2e-report.json
            ${{ runner.temp }}/nightly-e2e/coverage-summary.md
            ${{ runner.temp }}/nightly-e2e/coverage-summary.json
            ${{ runner.temp }}/nightly-e2e/coverage-evidence-set.json
            ${{ runner.temp }}/nightly-e2e/evidence-manifest.json
            ${{ runner.temp }}/nightly-e2e/evidence/**/shots/*.png
            ${{ runner.temp }}/nightly-e2e/evidence/**/artifacts/*
            ${{ runner.temp }}/nightly-e2e/evidence/**/network/*.bin
            ${{ runner.temp }}/nightly-e2e/cohorts/**/evidence-manifest.json
            ${{ runner.temp }}/nightly-e2e/cohorts/**/*-e2e-report.json
            ${{ runner.temp }}/nightly-e2e/cohorts/**/evidence/**/shots/*.png
            ${{ runner.temp }}/nightly-e2e/cohorts/**/evidence/**/artifacts/*
            ${{ runner.temp }}/nightly-e2e/cohorts/**/evidence/**/network/*.bin
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: nightly-stock-results
          path: |
            ${{ runner.temp }}/nightly-stock-preflight/report.json
            ${{ runner.temp }}/nightly-stock-preflight/network/*.bin
          if-no-files-found: ignore
          retention-days: 14
