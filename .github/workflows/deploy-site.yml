name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'packages/site/**'
      - 'packages/plugin/**'
      - 'packages/runtime/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Install only the site package + its deps. A full-workspace install
      # pulls examples/batch, which carries a local-only `file:` dependency
      # (webgpu-optimizer-report, a sibling of this repo) that does not exist
      # on a fresh CI checkout and fails `--frozen-lockfile`. The site is
      # self-contained (three + vite), so scoping the install sidesteps it.
      - run: pnpm install --frozen-lockfile --filter "@tsl-precompile/site..."
      - run: pnpm build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
