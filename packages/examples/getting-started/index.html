<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="icon" href="data:,">
	<title>tsl-precompile / getting-started</title>
	<style>
		html, body { margin: 0; padding: 0; height: 100%; background: #101418; color: #fff; font-family: monospace; overflow: hidden; }
		canvas { display: block; }
		#info {
			position: fixed; top: 8px; left: 8px; padding: 8px 12px;
			background: rgba(0,0,0,0.6); font-size: 12px; line-height: 1.5;
			pointer-events: none; z-index: 10;
		}
		#info code { color: #8df; }
		#status { color: #8df; }
	</style>
</head>
<body>
	<div id="info">
		<div><strong>tsl-precompile / getting-started</strong></div>
		<div>minimal scene: a torus knot with one precompiled <code>MeshStandardNodeMaterial</code></div>
		<div>status: <span id="status">starting…</span></div>
	</div>
	<script type="module" src="./main.js"></script>
	<script type="module">
		import { WebGPURenderer } from 'three/webgpu';

		const compilerFree = WebGPURenderer.__TSLP_SLIM__ === true;
		const result = window.__TSLP_SITE_RESULT__ = {
			id: 'getting-started',
			ready: false,
			runtimeMode: compilerFree ? 'pure-slim' : 'compatibility',
			compilerFree,
			animationFrames: 0,
			canvasCount: 0,
			errors: [],
		};
		const publish = () => window.parent.postMessage( { type: 'tslp-example-status', result: { ...result } }, location.origin );
		window.addEventListener( 'error', event => {
			result.errors.push( event.message || 'window error' );
			publish();
		} );
		window.addEventListener( 'unhandledrejection', event => {
			result.errors.push( String( event.reason?.message || event.reason || 'unhandled rejection' ) );
			publish();
		} );
		const observe = () => {
			result.animationFrames += 1;
			result.canvasCount = document.querySelectorAll( 'canvas' ).length;
			const rendererReady = document.getElementById( 'status' )?.textContent === 'renderer ready';
			const ready = rendererReady && result.canvasCount > 0 && result.errors.length === 0;
			if ( ready !== result.ready || result.animationFrames === 1 || result.animationFrames % 120 === 0 ) {
				result.ready = ready;
				publish();
			}
			requestAnimationFrame( observe );
		};
		observe();
	</script>
</body>
</html>
